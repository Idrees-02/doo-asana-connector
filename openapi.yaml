      responses:
        "200":
          description: Metrics.
components:
  schemas:
    ExecutionMeta:
      type: object
      description: Execution metadata attached to every response.
      required:
        - requestId
        - actionId
        - provider
        - mode
        - demoData
        - durationMs
      properties:
        requestId:
          type: string
          description: Connector-generated. Asana does not return a request id.
        actionId:
          type: string
        provider:
          type: string
          enum:
            - asana
        mode:
          type: string
          enum:
            - live
            - demo
          description: Whether this result came from Asana or the in-memory demo API.
        demoData:
          type: boolean
          description: True when the payload is synthetic. Never true for live Asana data.
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        upstreamCalls:
          type: integer
        attempts:
          type: integer
          description: Attempts including retries.
        deprecations:
          type: array
          description: Notices captured from Asana-Change response headers.
          items:
            type: object
    ConnectorError:
      type: object
      description: The single normalized error shape returned by every endpoint.
      required:
        - code
        - message
        - provider
        - requestId
        - retryable
        - retryStrategy
      properties:
        code:
          type: string
          enum:
            - ASANA_VALIDATION_ERROR
            - ASANA_BAD_REQUEST
            - ASANA_AUTHENTICATION_ERROR
            - ASANA_PAYMENT_REQUIRED
            - ASANA_PERMISSION_DENIED
            - ASANA_NOT_FOUND
            - ASANA_CONFLICT
            - ASANA_UNAVAILABLE_LEGAL
            - ASANA_RATE_LIMITED
            - ASANA_SERVER_ERROR
            - ASANA_BAD_GATEWAY
            - ASANA_SERVICE_UNAVAILABLE
            - ASANA_TIMEOUT
            - ASANA_NETWORK_ERROR
            - ASANA_APPROVAL_REQUIRED
            - ASANA_UNKNOWN_ACTION
            - ASANA_INVALID_RESPONSE
            - ASANA_UNKNOWN_ERROR
        message:
          type: string
          description: Human-readable. Redacted; never contains a token.
        provider:
          type: string
          enum:
            - asana
        action:
          type:
            - string
            - "null"
        requestId:
          type: string
        httpStatus:
          type:
            - integer
            - "null"
        retryable:
          type: boolean
        retryStrategy:
          type: string
          enum:
            - none
            - immediate
            - backoff
            - after_delay
            - manual_with_idempotency_key
          description: How to respond. "manual_with_idempotency_key" means the write may already have taken
            effect and must not be blindly retried.
        retryAfterMs:
          type:
            - integer
            - "null"
        severity:
          type: string
          enum:
            - warning
            - error
        guidance:
          type: string
          description: Suggested next step, in plain language.
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              reason:
                type: string
        providerPhrase:
          type:
            - string
            - "null"
          description: Asana's diagnostic phrase, present on 500s.
        occurredAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ConnectorError"
        meta:
          $ref: "#/components/schemas/ExecutionMeta"
  securitySchemes:
    serverSideCredential:
      type: apiKey
      in: header
      name: x-not-used
      description: This API does not accept Asana credentials from the client. The server holds the
        Personal Access Token or OAuth tokens and attaches them upstream, so the browser never
        handles a secret.
