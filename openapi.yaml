  /api/actions/asana.update_task:
    post:
      operationId: asana_update_task
      summary: Update Task
      description: >-
        Update selected fields on an Asana task. Omitted fields are left untouched; an explicit null
        clears a field.


        **Type:** WRITE · **Risk:** medium

        **Asana endpoints:** PUT /tasks/{task_gid}, GET /tasks/{task_gid}

        **Scopes:** tasks:write, tasks:read


        **Duplicate behaviour:** Applying the same patch twice is harmless: the task ends in the
        same state, and no new object is created.

        **Retry behaviour:** Safe to retry, because the operation is idempotent. The client retries
        429 and 5xx up to 2 further attempts, honouring Retry-After.

        **Idempotency:** Naturally idempotent, so an idempotency key is optional. Use
        ifUnmodifiedSince to avoid overwriting a concurrent edit.
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    taskId:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: The Asana task gid to update.
                    patch:
                      type: object
                      properties:
                        name:
                          description: New task title.
                          type: string
                          minLength: 1
                          maxLength: 1024
                        notes:
                          description: New description. Null clears it.
                          anyOf:
                            - type: string
                              maxLength: 65535
                            - type: "null"
                        assignee:
                          description: User gid, email, or "me". Null unassigns the task.
                          anyOf:
                            - type: string
                              minLength: 1
                            - type: "null"
                        dueOn:
                          description: Due date (YYYY-MM-DD). Null clears it.
                          anyOf:
                            - type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Date in YYYY-MM-DD format.
                            - type: "null"
                        dueAt:
                          description: Due date-time (ISO 8601). Null clears it.
                          anyOf:
                            - type: string
                              description: ISO 8601 date-time, e.g. "2026-03-01T17:00:00Z".
                            - type: "null"
                        completed:
                          description: Completion state.
                          type: boolean
                      description: Fields to change. Omitted fields are left untouched; an explicit null clears the field.
                    ifUnmodifiedSince:
                      description: The task's modifiedAt value when it was loaded. When supplied, the update is rejected
                        with ASANA_CONFLICT if the task changed since then, preventing a silent
                        overwrite of a concurrent edit.
                      type: string
                  required:
                    - taskId
                    - patch
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Rename a task
                value:
                  input:
                    taskId: "1201234567890123"
                    patch:
                      name: Updated title
                  approved: true
              example2:
                summary: Mark complete
                value:
                  input:
                    taskId: "1201234567890123"
                    patch:
                      completed: true
                  approved: true
              example3:
                summary: Clear the due date
                description: An explicit null clears the field; omitting it would leave it unchanged.
                value:
                  input:
                    taskId: "1201234567890123"
                    patch:
                      dueOn: null
                  approved: true
              example4:
                summary: Safe edit with concurrency check
                value:
                  input:
                    taskId: "1201234567890123"
                    patch:
                      notes: Revised description
                    ifUnmodifiedSince: 2026-08-08T10:15:00.000Z
                  approved: true
      responses:
        "200":
          description: The action completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                  - meta
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      task:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Asana task gid.
                          name:
                            anyOf:
                              - type: string
                              - type: "null"
                          notes:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Plain-text task description.
                          completed:
                            anyOf:
                              - type: boolean
                              - type: "null"
                          completedAt:
                            anyOf:
                              - type: string
                              - type: "null"
                          dueOn:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Due date, YYYY-MM-DD.
                          dueAt:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Due date-time, ISO 8601. Mutually exclusive with dueOn.
                          startOn:
                            anyOf:
                              - type: string
                              - type: "null"
                          assignee:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                  email:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                  - email
                                additionalProperties: false
                                description: An Asana user.
                              - type: "null"
                          workspace:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          parent:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          projects:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  anyOf:
                                    - type: string
                                    - type: "null"
                              required:
                                - id
                                - name
                              additionalProperties: false
                              description: A reference to another Asana object.
                          tags:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  anyOf:
                                    - type: string
                                    - type: "null"
                              required:
                                - id
                                - name
                              additionalProperties: false
                              description: A reference to another Asana object.
                          subtaskCount:
                            anyOf:
                              - type: number
                              - type: "null"
                          resourceSubtype:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: default_task | milestone | approval | custom.
                          url:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Permalink to the task in the Asana web app.
                          createdAt:
                            anyOf:
                              - type: string
                              - type: "null"
                          modifiedAt:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Last modification time. Pass back as `ifUnmodifiedSince` on update to guard against
                              overwriting a concurrent edit.
                        required:
                          - id
                          - name
                          - notes
                          - completed
                          - completedAt
                          - dueOn
                          - dueAt
                          - startOn
                          - assignee
                          - workspace
                          - parent
                          - projects
                          - tags
                          - subtaskCount
                          - resourceSubtype
                          - url
                          - createdAt
                          - modifiedAt
                        additionalProperties: false
                        description: An Asana task.
                      updatedFields:
                        type: array
                        items:
                          type: string
                        description: The patch keys that were actually sent to Asana.
                    required:
                      - task
                      - updatedFields
                    additionalProperties: false
                  meta:
                    $ref: "#/components/schemas/ExecutionMeta"
        "400":
          description: Input failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Asana authentication is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Permission denied, or the required approval flag was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The action or the referenced Asana object was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The task changed after it was loaded (stale-write guard).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Asana rate limit exceeded.
          content:
