      description: Returns connector identity, resolved run mode and configuration. Contains no credential
        values by construction.
      tags:
        - connector
      responses:
        "200":
          description: Current status.
  /api/connector/test:
    post:
      operationId: testConnection
      summary: Verify authentication (read-only)
      description: Performs a single GET /users/me against Asana. Creates nothing, modifies nothing,
        deletes nothing. Never returns a token.
      tags:
        - connector
      responses:
        "200":
          description: Connection test result.
  /api/connector/manifest:
    get:
      operationId: getManifest
      summary: Connector manifest
      tags:
        - connector
      responses:
        "200":
          description: The connector manifest.
  /api/connector/schemas/{actionId}:
    get:
      operationId: getActionSchema
      summary: JSON Schema for one action
      tags:
        - connector
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
            enum:
              - asana.list_projects
              - asana.list_project_tasks
              - asana.create_task
              - asana.update_task
              - asana.add_comment
      responses:
        "200":
          description: Input and output JSON Schema.
  /api/health:
    get:
      operationId: getHealth
      summary: Component health
      description: Read-only. Health checks never modify Asana data.
      tags:
        - operations
      responses:
        "200":
          description: All components healthy.
        "503":
          description: One or more components are degraded or unauthenticated.
  /api/activity:
    get:
      operationId: listActivity
      summary: Recent executions
      description: Redacted request/response history from an in-memory ring buffer.
      tags:
        - operations
      responses:
        "200":
          description: Recent activity entries.
  /api/metrics:
    get:
      operationId: getMetrics
      summary: Real request metrics
