  /api/actions/asana.create_project:
    post:
      operationId: asana_create_project
      summary: Create Project
      description: >-
        Create a new Asana project in a workspace. A team gid is required when the workspace is an
        organization.


        **Type:** WRITE · **Risk:** high

        **Asana endpoints:** POST /projects

        **Scopes:** projects:write


        **Duplicate behaviour:** Asana has no server-side deduplication: calling this twice creates
        two separate projects with different gids.

        **Retry behaviour:** NEVER retried automatically. A failed create may already have succeeded
        (particularly on timeout), so the connector reports
        retryStrategy=manual_with_idempotency_key and leaves the decision to the caller.

        **Idempotency:** Supply idempotencyKey to make deliberate retries safe: a repeated key
        replays the original result instead of creating a second object. Process-local, 15-minute
        TTL — it does not survive a restart.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 1024
                    workspace:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: Workspace to create the project in. Required by Asana.
                    team:
                      description: Team gid. REQUIRED when the workspace is an organization — Asana rejects the request
                        without it.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    notes:
                      description: Project description.
                      type: string
                      maxLength: 65535
                    color:
                      description: Asana colour name, e.g. "light-green".
                      type: string
                      minLength: 1
                    privacySetting:
                      description: Access level. Asana deprecated the older "public" boolean.
                      type: string
                      enum:
                        - public_to_workspace
                        - private
                    dueOn:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      description: Date in YYYY-MM-DD format.
                    startOn:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      description: Date in YYYY-MM-DD format.
                  required:
                    - name
                    - workspace
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Minimal project
                value:
                  input:
                    name: Q4 Launch
                    workspace: "1201234567890000"
                  approved: true
              example2:
                summary: Project in an organization
                description: Organizations require a team.
                value:
                  input:
                    name: Q4 Launch
                    workspace: "1201234567890000"
                    team: "1201234567890777"
                    notes: Launch coordination.
                  approved: true
      responses:
        "200":
          description: The action completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                  - meta
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Asana project gid.
                          name:
                            anyOf:
                              - type: string
                              - type: "null"
                          archived:
                            anyOf:
                              - type: boolean
                              - type: "null"
                            description: Null when Asana did not return the field.
                          color:
                            anyOf:
                              - type: string
                              - type: "null"
                          notes:
                            anyOf:
                              - type: string
                              - type: "null"
                          url:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Permalink to the project in the Asana web app.
                          workspace:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          owner:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          team:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
