      operationId: asana_list_tasks
      summary: List Tasks
      description: >-
        List tasks filtered by project, section, tag, or assignee within a workspace. At least one
        filter is required by Asana.


        **Type:** READ · **Risk:** low

        **Asana endpoints:** GET /tasks

        **Scopes:** tasks:read


        **Duplicate behaviour:** None. Reads have no side effects, so repeating this action changes
        nothing.

        **Retry behaviour:** Safe to retry automatically. The client retries 429 and 5xx up to 3
        attempts with backoff, honouring Retry-After.

        **Idempotency:** Not applicable — this action never modifies data.
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    limit:
                      default: 50
                      description: Results per page (1–100). Defaults to 50.
                      type: integer
                      minimum: 1
                      maximum: 100
                    cursor:
                      description: Opaque pagination cursor from a previous response. Asana only accepts cursors it issued
                        — a hand-constructed value will be rejected.
                      type: string
                      minLength: 1
                    project:
                      description: Filter to a project.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    section:
                      description: Filter to a section.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    tag:
                      description: Filter to a tag.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    assignee:
                      description: User gid, email or "me". Must be combined with workspace.
