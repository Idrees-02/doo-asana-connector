    post:
      operationId: asana_add_tag_to_task
      summary: Add Tag to Task
      description: >-
        Attach an existing tag to an Asana task.


        **Type:** WRITE · **Risk:** low

        **Asana endpoints:** POST /tasks/{task_gid}/addTag

        **Scopes:** tasks:write


        **Duplicate behaviour:** No duplicate is possible: a tag is either on the task or it is not.
        Repeating the call is a no-op.

        **Retry behaviour:** Safe to retry despite being a POST, because the operation only asserts
        an association rather than creating an object. The client retries 429 and 5xx up to 2
        further attempts.

        **Idempotency:** Naturally idempotent. An idempotency key is unnecessary — the association
        either exists or it does not.
      tags:
        - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    taskId:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: Asana global id (gid) — a numeric string.
                    tagId:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: Asana global id (gid) — a numeric string.
                  required:
                    - taskId
                    - tagId
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Tag a task
                value:
                  input:
                    taskId: "1201234567890123"
                    tagId: "1201234567890888"
                  approved: true
      responses:
        "200":
          description: The action completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                  - meta
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      changed:
                        type: boolean
                        const: true
                      subject:
                        type: object
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                        required:
                          - type
                          - id
                        additionalProperties: false
                      target:
                        type: object
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                        required:
                          - type
                          - id
                        additionalProperties: false
                    required:
                      - changed
                      - subject
                      - target
                    additionalProperties: false
                    description: Confirmation that an association was created or removed.
                  meta:
                    $ref: "#/components/schemas/ExecutionMeta"
        "400":
          description: Input failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
