                          id:
                            type: string
                            description: Asana task gid.
                          name:
                            anyOf:
                              - type: string
                              - type: "null"
                          notes:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: Plain-text task description.
                          completed:
