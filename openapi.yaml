  /api/actions/asana.create_tag:
    post:
      operationId: asana_create_tag
      summary: Create Tag
      description: >-
        Create a new Asana tag in a workspace.


        **Type:** WRITE · **Risk:** medium

        **Asana endpoints:** POST /tags

        **Scopes:** tags:write


        **Duplicate behaviour:** Asana has no server-side deduplication: calling this twice creates
        two separate tags with different gids.

        **Retry behaviour:** NEVER retried automatically. A failed create may already have succeeded
        (particularly on timeout), so the connector reports
        retryStrategy=manual_with_idempotency_key and leaves the decision to the caller.

        **Idempotency:** Supply idempotencyKey to make deliberate retries safe: a repeated key
        replays the original result instead of creating a second object. Process-local, 15-minute
        TTL — it does not survive a restart.
      tags:
        - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 1024
                    workspace:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: Workspace to create the tag in. Required by Asana.
                    color:
                      description: Asana colour name, e.g. "light-green".
                      type: string
                      minLength: 1
                    notes:
                      type: string
                      maxLength: 65535
                  required:
                    - name
                    - workspace
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Create a tag
                value:
                  input:
                    name: launch-blocker
                    workspace: "1201234567890000"
                  approved: true
      responses:
        "200":
          description: The action completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                  - meta
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      tag:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Asana tag gid.
                          name:
                            anyOf:
                              - type: string
                              - type: "null"
                          color:
                            anyOf:
                              - type: string
                              - type: "null"
                          notes:
                            anyOf:
                              - type: string
                              - type: "null"
                          workspace:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          url:
                            anyOf:
                              - type: string
                              - type: "null"
                          createdAt:
                            anyOf:
                              - type: string
                              - type: "null"
                        required:
                          - id
                          - name
                          - color
                          - notes
                          - workspace
                          - url
                          - createdAt
                        additionalProperties: false
                        description: An Asana tag.
                      created:
                        type: boolean
                        const: true
                    required:
                      - tag
                      - created
                    additionalProperties: false
                  meta:
                    $ref: "#/components/schemas/ExecutionMeta"
        "400":
          description: Input failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Asana authentication is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Permission denied, or the required approval flag was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The action or the referenced Asana object was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The task changed after it was loaded (stale-write guard).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Asana rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Asana returned an upstream error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: The request to Asana timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
