                            anyOf:
                              - type: string
                              - type: "null"
                          createdBy:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          type:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: '"comment" or "system".'
                          resourceSubtype:
                            anyOf:
                              - type: string
                              - type: "null"
                          isPinned:
                            anyOf:
                              - type: boolean
                              - type: "null"
                        required:
                          - id
                          - text
                          - createdAt
                          - createdBy
                          - type
                          - resourceSubtype
                          - isPinned
                        additionalProperties: false
                        description: A comment (Asana "story") on a task.
                      taskId:
                        type: string
                    required:
