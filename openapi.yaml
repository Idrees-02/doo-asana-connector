  /api/actions/asana.create_task:
    post:
      operationId: asana_create_task
      summary: Create Task
      description: >-
        Create a new task in an Asana project or workspace.


        **Type:** WRITE · **Risk:** medium

        **Asana endpoints:** POST /tasks

        **Scopes:** tasks:write


        **Duplicate behaviour:** Asana has no server-side deduplication: calling this twice creates
        two separate tasks with different gids.

        **Retry behaviour:** NEVER retried automatically. A failed create may already have succeeded
        (particularly on timeout), so the connector reports
        retryStrategy=manual_with_idempotency_key and leaves the decision to the caller.

        **Idempotency:** Supply idempotencyKey to make deliberate retries safe: a repeated key
        replays the original result instead of creating a second task. Process-local and 15-minute
        TTL — it does not survive a restart.
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: The task title.
                    notes:
                      description: Plain-text task description.
                      type: string
                      maxLength: 65535
                    projectId:
                      description: Project to add the task to. Either projectId or workspace is required.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    workspace:
                      description: Workspace to create the task in. Required when projectId is omitted.
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                    assignee:
                      description: Assignee as a user gid, an email address, or the literal "me".
                      type: string
                      minLength: 1
                    dueOn:
                      description: Due date (YYYY-MM-DD). Mutually exclusive with dueAt.
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    dueAt:
                      description: Due date-time (ISO 8601). Mutually exclusive with dueOn.
                      type: string
                    followers:
                      description: User gids or email addresses to add as followers.
                      maxItems: 50
                      type: array
                      items:
                        type: string
                        minLength: 1
                  required:
                    - name
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Minimal task in a project
                value:
                  input:
                    projectId: "1201234567890123"
                    name: Prepare launch documentation
                  approved: true
              example2:
                summary: Full task
                value:
                  input:
                    projectId: "1201234567890123"
                    name: Validate MCP endpoint
                    notes: Confirm all five tools are exposed and schemas match the connector.
