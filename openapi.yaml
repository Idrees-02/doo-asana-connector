  /api/actions/asana.add_comment:
    post:
      operationId: asana_add_comment
      summary: Add Comment
      description: >-
        Post a plain-text comment onto an Asana task.


        **Type:** WRITE · **Risk:** medium

        **Asana endpoints:** POST /tasks/{task_gid}/stories

        **Scopes:** stories:write


        **Duplicate behaviour:** Calling this twice posts two separate comments. They are visible to
        every task follower, and this connector cannot delete them.

        **Retry behaviour:** NEVER retried automatically. A failed request may already have posted
        the comment, so the connector reports retryStrategy=manual_with_idempotency_key rather than
        risking a double post.

        **Idempotency:** Supply idempotencyKey to make deliberate retries safe: a repeated key
        replays the original result instead of posting again. Process-local, 15-minute TTL. The
        console additionally warns before re-posting identical text within 60 seconds.
      tags:
        - comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - approved
              properties:
                input:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  type: object
                  properties:
                    taskId:
                      type: string
                      minLength: 1
                      pattern: ^\d+$
                      description: The Asana task gid to comment on.
                    text:
                      description: The plain-text comment body. Leading and trailing whitespace is trimmed.
                      type: string
                  required:
                    - taskId
                    - text
                approved:
                  type: boolean
                  description: Must be true. This action modifies data in Asana and will not run without explicit
                    approval.
                idempotencyKey:
                  type: string
                  description: Optional. Reuse when retrying so the operation is not applied twice. Process-local,
                    15-minute TTL.
            examples:
              example1:
                summary: Add a comment
                value:
                  input:
                    taskId: "1201234567890123"
                    text: Verified against the sandbox workspace.
                  approved: true
      responses:
        "200":
          description: The action completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - data
                  - meta
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      comment:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Asana story gid.
                          text:
                            anyOf:
                              - type: string
                              - type: "null"
                          createdAt:
                            anyOf:
                              - type: string
                              - type: "null"
                          createdBy:
                            anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                      - type: string
                                      - type: "null"
                                required:
                                  - id
                                  - name
                                additionalProperties: false
                                description: A reference to another Asana object.
                              - type: "null"
                          type:
                            anyOf:
                              - type: string
                              - type: "null"
                            description: '"comment" or "system".'
                          resourceSubtype:
                            anyOf:
                              - type: string
                              - type: "null"
                          isPinned:
                            anyOf:
                              - type: boolean
                              - type: "null"
                        required:
                          - id
                          - text
                          - createdAt
                          - createdBy
                          - type
                          - resourceSubtype
                          - isPinned
                        additionalProperties: false
                        description: A comment (Asana "story") on a task.
                      taskId:
                        type: string
                    required:
                      - comment
                      - taskId
                    additionalProperties: false
                  meta:
                    $ref: "#/components/schemas/ExecutionMeta"
        "400":
          description: Input failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Asana authentication is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
